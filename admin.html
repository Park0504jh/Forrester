
<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="js/admin-access.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 인증 | 인물록</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f2ecdf;
            color: #302a23;
            font-family: "Noto Serif KR", "Batang", serif;
        }

        .panel {
            width: 100%;
            max-width: 420px;
            padding: 36px 28px;
            border: 1px solid #c9bba5;
            background: #faf6ed;
            box-shadow: 0 8px 28px #302a2310;
        }

        .eyebrow {
            margin: 0 0 12px;
            text-align: center;
            color: #827667;
            font-size: 11px;
            letter-spacing: .2em;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: .14em;
        }

        .description {
            margin: 16px 0 28px;
            color: #827667;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 13px;
        }

        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #c9bba5;
            border-radius: 0;
            background: #fffdf8;
            color: #302a23;
            font: inherit;
        }

        button {
            width: 100%;
            min-height: 46px;
            margin-top: 24px;
            border: 1px solid #843d32;
            background: #843d32;
            color: #fffaf2;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            min-height: 24px;
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .back {
            display: block;
            margin-top: 22px;
            color: #827667;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="panel">
        <p class="eyebrow">人物錄 · 管理者</p>
        <h1 id="title">관리자 인증</h1>
        <p class="description" id="description">
            관리자 인증 상태를 확인하고 있습니다.
        </p>

        <form id="auth-form" hidden>
            <div id="confirm-wrap" hidden>
                <label for="confirm-password">
                    비밀번호 확인
                </label>
                <input
                    id="confirm-password"
                    type="password"
                    autocomplete="new-password"
                >
            </div>

            <label for="password" id="password-label">
                관리자 비밀번호
            </label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="submit-button" type="submit">
                확인
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
        <a class="back" href="/">인물록으로 돌아가기</a>
    </main>

    <script>
        const form = document.getElementById("auth-form");
        const title = document.getElementById("title");
        const description = document.getElementById("description");
        const password = document.getElementById("password");
        const confirmWrap = document.getElementById("confirm-wrap");
        const confirmPassword = document.getElementById("confirm-password");
        const submitButton = document.getElementById("submit-button");
        const message = document.getElementById("message");

        let setupMode = false;

        async function checkStatus() {
            try {
                const response = await fetch("/api/auth/status");
                const data = await response.json();

                if (!response.ok) {
                    throw new Error("인증 상태를 확인하지 못했습니다.");
                }

                if (data.loggedIn) {
                    title.textContent = "관리자 로그인 완료";
                    description.textContent =
                        "현재 이 브라우저는 관리자 인증 상태입니다.";
                    message.textContent = "";
                    form.hidden = true;

                    const logoutButton = document.createElement("button");
                    logoutButton.textContent = "로그아웃";
                    logoutButton.type = "button";
                    logoutButton.onclick = async () => {
                        logoutButton.disabled = true;

                        try {
                            const result = await fetch("/api/auth/logout", {
                                method: "POST"
                            });

                            if (!result.ok) {
                                throw new Error("로그아웃에 실패했습니다.");
                            }

                            location.reload();
                        } catch (error) {
                            message.textContent = error.message;
                            logoutButton.disabled = false;
                        }
                    };

                    form.parentNode.insertBefore(
                        logoutButton,
                        message
                    );

                    return;
                }

                setupMode = !data.configured;

                if (setupMode) {
                    title.textContent = "최초 관리자 설정";
                    description.textContent =
                        "관리자 비밀번호를 설정해 주세요. 12자 이상을 권장합니다.";
                    confirmWrap.hidden = false;
                    confirmPassword.required = true;
                    password.autocomplete = "new-password";
                    submitButton.textContent = "관리자 비밀번호 등록";
                } else {
                    title.textContent = "관리자 로그인";
                    description.textContent =
                        "등록된 관리자 비밀번호를 입력해 주세요.";
                    confirmWrap.hidden = true;
                    confirmPassword.required = false;
                    password.autocomplete = "current-password";
                    submitButton.textContent = "로그인";
                }

                form.hidden = false;
            } catch (error) {
                message.textContent =
                    "서버에 연결할 수 없습니다. 서버 실행 상태를 확인해 주세요.";
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            message.textContent = "";
            submitButton.disabled = true;

            try {
                const endpoint = setupMode
                    ? "/api/auth/setup"
                    : "/api/auth/login";

                const body = { password: password.value };

                if (setupMode) {
                    body.confirmPassword = confirmPassword.value;
                }

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "요청에 실패했습니다.");
                }

                message.textContent = data.message;

                if (setupMode) {
                    password.value = "";
                    confirmPassword.value = "";
                    await checkStatus();
                } else {
                    location.href = "/";
                }
            } catch (error) {
                message.textContent = error.message;
            } finally {
                submitButton.disabled = false;
            }
        });

        checkStatus();
    </script>
</body>
</html>
